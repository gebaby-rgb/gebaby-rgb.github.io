    /* Custom styles for Project Details Page */
    .project-detail-body {
      padding-top: 8rem;
      padding-bottom: 6rem;
      min-height: 100vh;
    }
    
    .back-btn-wrapper {
      margin-bottom: 2rem;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-weight: 600;
      transition: var(--transition-fast);
      font-size: 1.05rem;
    }
    
    .back-btn:hover {
      color: var(--text-primary);
      transform: translateX(-5px);
    }
    
    [dir="rtl"] .back-btn:hover {
      transform: translateX(5px);
    }
    
    [dir="rtl"] .back-btn i {
      transform: scaleX(-1);
    }
    
    .project-detail-title {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text-primary) 30%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .project-detail-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 3rem;
      margin-top: 2rem;
    }
    
    /* Screenshot Gallery & Slider */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .main-image-wrapper {
      position: relative;
      aspect-ratio: 16/9;
      background-color: var(--bg-deep);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .thumbnails-container {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    
    .thumbnail-btn {
      width: 100px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--bg-deep);
      transition: var(--transition-fast);
      opacity: 0.6;
      flex-shrink: 0;
    }
    
    .thumbnail-btn:hover,
    .thumbnail-btn.active {
      border-color: var(--accent);
      opacity: 1;
    }
    
    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Project Specs/Details */
    .project-info-section {
      margin-top: 2.5rem;
    }
    
    .info-section-title {
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .info-section-title i {
      color: var(--accent);
    }
    
    .project-long-desc {
      color: var(--text-secondary);
      font-size: 1.1rem;
      line-height: 1.7;
      text-align: justify;
      margin-bottom: 2rem;
    }
    
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .feature-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }
    
    .feature-item i {
      color: var(--accent-secondary);
      margin-top: 0.25rem;
    }
    
    /* Sidebar Meta Card */
    .meta-sidebar-card {
      padding: 2rem;
      position: sticky;
      top: 100px;
    }
    
    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    
    .meta-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .meta-value {
      font-size: 1.05rem;
      color: var(--text-primary);
      font-weight: 500;
    }
    
    .meta-value-path {
      font-family: monospace;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      word-break: break-all;
      direction: ltr;
      text-align: left;
    }
    
    .meta-tags-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    
    @media (max-width: 992px) {
      .project-detail-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .meta-sidebar-card {
        position: relative;
        top: 0;
      }
    }
    
    @media (max-width: 768px) {
      .project-detail-title {
        font-size: 2.25rem;
      }

      const project = projectsData[projectId];

      const setLanguage = (lang) => {
        currentLang = lang;
        localStorage.setItem('portfolio_lang', lang);
        
        // Set document attributes
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        // Update lang switcher display text
        if (langSwitcher && langText) {
          langText.textContent = lang === 'en' ? 'العربية' : 'English';
        }

        // Apply page translations
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (pageTranslations[lang] && pageTranslations[lang][key]) {
            el.textContent = pageTranslations[lang][key];
          }
        });

        // Load project data
        if (project) {
          const data = project[lang];
          
          // Set Title
          document.getElementById('project-title').textContent = data.title;
          document.title = `${data.title} | ${lang === 'en' ? 'Project Details' : 'تفاصيل المشروع'}`;
          
          // Set Description
          document.getElementById('project-description').textContent = data.description;
          
          // Set Features
          const featuresList = document.getElementById('project-features');
          featuresList.innerHTML = '';
          data.features.forEach(feat => {
            const item = document.createElement('div');
            item.className = 'feature-item';
            item.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${feat}</span>`;
            featuresList.appendChild(item);
          });
          
          // Set Status
          document.getElementById('project-status').textContent = data.status;
        }
      };

      // Populate Project Data once on load (non-lingual metadata)
      if (project) {
        // Set path
        document.getElementById('project-path').textContent = project.path;
        
        // Set code link
        const codeBtn = document.getElementById('project-code-btn');
        if (codeBtn) {
          codeBtn.setAttribute('href', project.codeLink);
        }
        
        // Set Tech Tags
        const techWrapper = document.getElementById('project-tech');
        techWrapper.innerHTML = '';
        project.tech.forEach(t => {
          const tag = document.createElement('span');
          tag.className = 'project-tag';
          tag.textContent = t;
          techWrapper.appendChild(tag);
        });
        
        // Set Images & Gallery
        const mainImage = document.getElementById('main-screenshot');
        const thumbnailsWrapper = document.getElementById('thumbnails-wrapper');
        thumbnailsWrapper.innerHTML = '';
        
        if (project.images && project.images.length > 0) {
          // Set initial main image
          mainImage.setAttribute('src', project.images[0]);
          
          // Create thumbnails
          project.images.forEach((img, index) => {
            const btn = document.createElement('button');
            btn.className = `thumbnail-btn ${index === 0 ? 'active' : ''}`;
            btn.innerHTML = `<img src="${img}" alt="Thumbnail preview" class="thumbnail-img">`;
            btn.addEventListener('click', () => {
              // Set main image source
              mainImage.setAttribute('src', img);
              // Toggle active class
              document.querySelectorAll('.thumbnail-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });
            thumbnailsWrapper.appendChild(btn);
          });
        }
      }

      if (langSwitcher) {
        langSwitcher.addEventListener('click', () => {
          const nextLang = currentLang === 'en' ? 'ar' : 'en';
          setLanguage(nextLang);
        });
      }

      // Initialize Language on load
      setLanguage(currentLang);
    });
  </script>
</body>
</html>
