<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Tajawal','Cairo','Segoe UI',Arial,sans-serif">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A28"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1600" height="1000" fill="#080B11"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- Browser window frame -->
  <g transform="translate(140,90)">
    <rect x="0" y="0" width="1320" height="820" rx="18" fill="url(#frameBg)" stroke="#22304A" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1320" height="64" rx="18" fill="#0F1622"/>
    <rect x="0" y="46" width="1320" height="18" fill="#0F1622"/>
    <circle cx="34" cy="32" r="7" fill="#EF4444"/>
    <circle cx="60" cy="32" r="7" fill="#F59E0B"/>
    <circle cx="86" cy="32" r="7" fill="#10B981"/>
    <rect x="130" y="16" width="560" height="32" rx="16" fill="#182234" stroke="#26344C" stroke-width="1"/>
    <text x="410" y="37" text-anchor="middle" fill="#8895AB" font-size="16" dir="ltr">alfares-almoaser.pages.dev</text>

    <!-- App header -->
    <g transform="translate(40,96)">
      <text x="0" y="30" fill="#F3F4F6" font-size="30" font-weight="700" text-anchor="start">المنصة الفارس المعاصر</text>
      <rect x="0" y="46" width="230" height="34" rx="17" fill="#0D2A30" stroke="#0E7490" stroke-width="1.5"/>
      <text x="115" y="69" text-anchor="middle" fill="#5EEAD4" font-size="16">الصف الثاني الثانوي</text>
    </g>

    <!-- Timer badge -->
    <g transform="translate(1010,96)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="#101826" stroke="#06B6D4" stroke-width="1.5"/>
      <circle cx="34" cy="23" r="11" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
      <path d="M34 16 v8 l6 4" stroke="#06B6D4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="140" y="30" text-anchor="middle" fill="#E5F9FB" font-size="20" font-weight="600" dir="ltr">29:41</text>
    </g>

    <!-- Progress -->
    <g transform="translate(40,190)">
      <text x="1200" y="0" text-anchor="end" fill="#9CA3AF" font-size="16" dir="rtl">السؤال 5 من 25</text>
      <rect x="0" y="14" width="1200" height="10" rx="5" fill="#1A2333"/>
      <rect x="0" y="14" width="240" height="10" rx="5" fill="url(#btnGrad)"/>
    </g>

    <!-- Question card -->
    <g transform="translate(40,250)">
      <rect x="0" y="0" width="1200" height="150" rx="14" fill="#0F1826" stroke="#1E293B" stroke-width="1"/>
      <rect x="1130" y="20" width="46" height="46" rx="10" fill="#132033" stroke="#233248" stroke-width="1"/>
      <text x="1153" y="50" text-anchor="middle" fill="#5EEAD4" font-size="20" font-weight="700">٥</text>
      <rect x="40" y="34" width="980" height="16" rx="8" fill="#26344C"/>
      <rect x="40" y="66" width="820" height="16" rx="8" fill="#1E293B"/>
      <rect x="40" y="98" width="520" height="16" rx="8" fill="#1E293B"/>
    </g>

    <!-- Options -->
    <g transform="translate(40,424)">
      <!-- Option A -->
      <rect x="0" y="0" width="1200" height="64" rx="12" fill="#0F1826" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="1150" cy="32" r="11" fill="none" stroke="#3B4A63" stroke-width="2"/>
      <rect x="140" y="22" width="900" height="14" rx="7" fill="#26344C"/>
      <!-- Option B - selected -->
      <rect x="0" y="80" width="1200" height="64" rx="12" fill="#0C2A2E" stroke="#06B6D4" stroke-width="2"/>
      <circle cx="1150" cy="112" r="11" fill="#06B6D4"/>
      <path d="M1144 112 l4 4 l9 -9" stroke="#08131A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="140" y="102" width="820" height="14" rx="7" fill="#5EEAD4" opacity="0.85"/>
      <!-- Option C -->
      <rect x="0" y="160" width="1200" height="64" rx="12" fill="#0F1826" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="1150" cy="192" r="11" fill="none" stroke="#3B4A63" stroke-width="2"/>
      <rect x="140" y="182" width="760" height="14" rx="7" fill="#26344C"/>
      <!-- Option D -->
      <rect x="0" y="240" width="1200" height="64" rx="12" fill="#0F1826" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="1150" cy="272" r="11" fill="none" stroke="#3B4A63" stroke-width="2"/>
      <rect x="140" y="262" width="860" height="14" rx="7" fill="#26344C"/>
    </g>

    <!-- Footer buttons -->
    <g transform="translate(40,742)">
      <rect x="0" y="0" width="150" height="50" rx="12" fill="#101826" stroke="#26344C" stroke-width="1.5"/>
      <text x="75" y="32" text-anchor="middle" fill="#9CA3AF" font-size="17">السابق</text>

      <rect x="1050" y="0" width="150" height="50" rx="12" fill="url(#btnGrad)"/>
      <text x="1125" y="32" text-anchor="middle" fill="#04141A" font-size="17" font-weight="700">التالي</text>
    </g>
  </g>

  <!-- Feature chips below the frame -->
  <g transform="translate(140,946)" font-size="15" fill="#B7C2D0">
    <g transform="translate(0,0)">
      <rect x="0" y="-24" width="230" height="40" rx="20" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.35)" stroke-width="1"/>
      <circle cx="26" cy="-4" r="6" fill="#06B6D4"/>
      <text x="42" y="1" text-anchor="start">تصحيح تلقائي فوري</text>
    </g>
    <g transform="translate(250,0)">
      <rect x="0" y="-24" width="230" height="40" rx="20" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
      <circle cx="26" cy="-4" r="6" fill="#10B981"/>
      <text x="42" y="1" text-anchor="start">حماية من الغش</text>
    </g>
    <g transform="translate(500,0)">
      <rect x="0" y="-24" width="270" height="40" rx="20" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
      <circle cx="26" cy="-4" r="6" fill="#F59E0B"/>
      <text x="42" y="1" text-anchor="start">أسئلة عشوائية لكل محاولة</text>
    </g>
  </g>
</svg>
