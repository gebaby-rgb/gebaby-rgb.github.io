<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Tajawal','Cairo','Segoe UI',Arial,sans-serif">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A28"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#080B11"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <g transform="translate(140,90)">
    <rect x="0" y="0" width="1320" height="820" rx="18" fill="url(#frameBg)" stroke="#22304A" stroke-width="2"/>
    <rect x="0" y="0" width="1320" height="64" rx="18" fill="#0F1622"/>
    <rect x="0" y="46" width="1320" height="18" fill="#0F1622"/>
    <circle cx="34" cy="32" r="7" fill="#EF4444"/>
    <circle cx="60" cy="32" r="7" fill="#F59E0B"/>
    <circle cx="86" cy="32" r="7" fill="#10B981"/>
    <rect x="130" y="16" width="560" height="32" rx="16" fill="#182234" stroke="#26344C" stroke-width="1"/>
    <text x="410" y="37" text-anchor="middle" fill="#8895AB" font-size="16" dir="ltr">alfares-almoaser.pages.dev</text>

    <text x="1280" y="130" text-anchor="end" fill="#F3F4F6" font-size="28" font-weight="700">نتيجة الامتحان</text>

    <!-- Score ring -->
    <g transform="translate(230,270)">
      <circle cx="0" cy="0" r="110" fill="none" stroke="#1A2333" stroke-width="18"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round"
        stroke-dasharray="622" stroke-dashoffset="90" transform="rotate(-90)"/>
      <text x="0" y="-4" text-anchor="middle" fill="#F3F4F6" font-size="46" font-weight="800">86%</text>
      <text x="0" y="34" text-anchor="middle" fill="#9CA3AF" font-size="18">17 من 20 إجابة صحيحة</text>
    </g>

    <!-- summary chips -->
    <g transform="translate(520,180)">
      <rect x="0" y="0" width="620" height="70" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
      <circle cx="40" cy="35" r="16" fill="#10B981"/>
      <path d="M32 35 l6 6 l12 -13" stroke="#04140F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="30" fill="#F3F4F6" font-size="18" font-weight="600">17 إجابة صحيحة</text>
      <text x="70" y="54" fill="#9CA3AF" font-size="14">من إجمالي 20 سؤال</text>

      <rect x="0" y="90" width="620" height="70" rx="14" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
      <circle cx="40" cy="125" r="16" fill="#EF4444"/>
      <path d="M33 118 l14 14 M47 118 l-14 14" stroke="#1A0505" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="120" fill="#F3F4F6" font-size="18" font-weight="600">3 إجابات خاطئة</text>
      <text x="70" y="144" fill="#9CA3AF" font-size="14">راجعها بالتفصيل أدناه</text>
    </g>

    <!-- Per-question review rows -->
    <g transform="translate(40,470)">
      <text x="1160" y="0" text-anchor="end" fill="#9CA3AF" font-size="16">مراجعة الإجابات</text>

      <!-- correct row -->
      <rect x="0" y="20" width="1200" height="72" rx="12" fill="#0F1826" stroke="#1E293B" stroke-width="1"/>
      <circle cx="1150" cy="56" r="14" fill="#10B981"/>
      <path d="M1142 56 l5 5 l11 -11" stroke="#04140F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="60" y="38" width="700" height="14" rx="7" fill="#26344C"/>
      <text x="1100" y="76" text-anchor="end" fill="#5EEAD4" font-size="14">إجابتك: ب — صحيحة</text>

      <!-- wrong row -->
      <rect x="0" y="104" width="1200" height="72" rx="12" fill="#0F1826" stroke="#3A1F26" stroke-width="1"/>
      <circle cx="1150" cy="140" r="14" fill="#EF4444"/>
      <path d="M1143 133 l14 14 M1157 133 l-14 14" stroke="#1A0505" stroke-width="3" stroke-linecap="round"/>
      <rect x="60" y="122" width="620" height="14" rx="7" fill="#26344C"/>
      <text x="1100" y="160" text-anchor="end" fill="#FCA5A5" font-size="14">إجابتك: أ — الصحيحة: ج</text>

      <!-- correct row 2 -->
      <rect x="0" y="188" width="1200" height="72" rx="12" fill="#0F1826" stroke="#1E293B" stroke-width="1"/>
      <circle cx="1150" cy="224" r="14" fill="#10B981"/>
      <path d="M1142 224 l5 5 l11 -11" stroke="#04140F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="60" y="206" width="760" height="14" rx="7" fill="#26344C"/>
      <text x="1100" y="244" text-anchor="end" fill="#5EEAD4" font-size="14">إجابتك: د — صحيحة</text>
    </g>
  </g>
</svg>
